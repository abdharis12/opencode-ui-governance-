```yaml
# ============================================================
# UNIVERSAL UI SYSTEM
# ============================================================
# Copy this file to the ROOT of a project as:
#
#   ui-system.yaml
#
# This file defines PROJECT-SPECIFIC UI/UX decisions.
#
# Global design knowledge is provided by the UI Governance
# engine and its reference files.
#
# ============================================================

version: 1


# ============================================================
# PROJECT
# ============================================================

project:

  name: "Project Name"

  description: "Project description"

  domain: "general"

  audience: "general users"

  language: "id"


# ============================================================
# VISUAL IDENTITY
# ============================================================

visual:

  # Primary visual language.
  #
  # Available global references may include:
  #
  # claymorphism
  # minimalist
  #
  # Additional styles can be added to the global engine.
  style: "claymorphism"


  # Optional secondary visual language.
  #
  # Use "none" when not required.
  secondary_style: "none"


  # Product personality.
  #
  # Examples:
  #
  # professional
  # modern
  # calm
  # premium
  # bold
  # playful
  # institutional
  # technical
  personality:
    - professional
    - modern
    - distinctive


  # ==========================================================
  # CREATIVE DIRECTION
  # ==========================================================

  creativity:

    # conservative
    # moderate
    # bold
    level: "bold"

    allow_asymmetry: true

    allow_visual_risk: true

    signature_element: true


# ============================================================
# THEME
# ============================================================

theme:

  # light
  # dark
  # system
  mode: "light"


  # ==========================================================
  # COLORS
  # ==========================================================

  colors:

    primary: "#000000"

    primary_foreground: "#FFFFFF"

    secondary: "#000000"

    secondary_foreground: "#FFFFFF"

    background: "#FFFFFF"

    foreground: "#111111"

    surface: "#FFFFFF"

    surface_elevated: "#FFFFFF"

    muted: "#F5F5F5"

    muted_foreground: "#666666"

    accent: "#000000"

    accent_foreground: "#FFFFFF"

    border: "#DDDDDD"

    input: "#DDDDDD"

    ring: "#000000"

    success: "#16A34A"

    success_foreground: "#FFFFFF"

    warning: "#CA8A04"

    warning_foreground: "#FFFFFF"

    destructive: "#DC2626"

    destructive_foreground: "#FFFFFF"

    info: "#2563EB"

    info_foreground: "#FFFFFF"


  # ==========================================================
  # TYPOGRAPHY
  # ==========================================================

  typography:

    font_family: ""

    display_family: ""

    body_family: ""

    display_weight: 700

    heading_weight: 600

    body_weight: 400

    label_weight: 500


  # ==========================================================
  # SPACING
  # ==========================================================

  spacing:

    # compact
    # comfortable
    # relaxed
    density: "comfortable"


  # ==========================================================
  # RADIUS
  # ==========================================================

  radius:

    # none
    # small
    # medium
    # large
    # extra-large
    scale: "medium"


  # ==========================================================
  # ELEVATION
  # ==========================================================

  elevation:

    # none
    # subtle
    # medium
    # strong
    intensity: "medium"


  # ==========================================================
  # CLAYMORPHISM
  # ==========================================================

  clay:

    enabled: true

    # subtle
    # medium
    # strong
    intensity: "medium"

    matte: true

    diffuse_lighting: true

    highlights: true

    soft_shadows: true

    inset_depth: true

    pressed_state: true


  # ==========================================================
  # GLASSMORPHISM
  # ==========================================================

  glass:

    enabled: false

    # subtle
    # medium
    # strong
    intensity: "subtle"

    # none
    # small
    # medium
    # large
    blur: "medium"

    opacity: 0.65

    # none
    # subtle
    # medium
    reflections: "subtle"


# ============================================================
# COMPONENT FOUNDATION
# ============================================================

components:

  foundation:

    - "shadcn"
    - "radix"


  reuse_existing: true


  preferred:

    - "Button"
    - "Card"
    - "Input"
    - "Textarea"
    - "Select"
    - "Checkbox"
    - "RadioGroup"
    - "Switch"
    - "Dialog"
    - "AlertDialog"
    - "DropdownMenu"
    - "Popover"
    - "Tabs"
    - "Sheet"
    - "Tooltip"
    - "Table"
    - "Badge"
    - "Skeleton"


# ============================================================
# UX
# ============================================================

ux:

  responsive: true

  mobile_first: true

  # relaxed
  # standard
  # strict
  accessibility: "strict"

  reduced_motion: true


  interaction:

    tactile: true

    feedback: true

    hover_feedback: true

    focus_visible: true


# ============================================================
# REFERENCE PAGES
# ============================================================
#
# Use paths relative to the project root.
#
# Example:
#
# landing:
#   resources/js/pages/welcome.tsx
#
# References should point to APPROVED pages.
# ============================================================

references:

  landing: ""

  dashboard: ""

  crud: ""

  form: ""

  detail: ""

  search: ""

  settings: ""

  file_manager: ""


# ============================================================
# PROJECT ASSETS
# ============================================================

assets:

  logo: ""

  brand_mark: ""

  organization_logo: ""

  favicon: ""


# ============================================================
# CONTENT
# ============================================================

content:

  # formal
  # professional
  # conversational
  # institutional
  tone: "professional"

  factual_claims_only: true


# ============================================================
# GOVERNANCE
# ============================================================

governance:

  reference_first: true

  reuse_components: true

  audit_after_ui_task: true

  no_unapproved_design_system: true

  no_random_colors: true

  no_random_radius: true

  no_random_shadows: true

  no_random_typography: true

  no_random_spacing: true

  no_page_specific_design_system: true

  accessibility_over_visual_effects: true

  limit_task_scope: true
